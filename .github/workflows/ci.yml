name: CI / Automated Tests & Code Quality

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  tests:
    name: PHP 8.3 & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Security Audit (PHP Composer)
        run: composer audit

      - name: Code Style Check (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Install NPM dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Security Audit (NPM)
        run: npm audit --audit-level=high

      - name: Setup Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Execute Test Suite (PHPUnit)
        run: php artisan test
